title: seojeon9 기술블로그
description: 개발하며 배운 것들을 기록합니다
url: https://seojeon9.github.io
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: dirt # air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise
locale: ko-KR
timezone: Asia/Seoul
search: true
paginate: 10
paginate_path: /page:num/

author:
  name: seojeon9
  bio: 개발하며 배운 것들을 기록합니다
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/seojeon9

plugins:
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: single
      author_profile: true
      toc: true
      toc_sticky: true
      read_time: true
      show_date: true
