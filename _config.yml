title: seojeon9 기록서랍
subtitle: 해낸 것과 고민한 것을 넣어 두는 곳
description: 해낸 것과 고민한 것을 기록하는 데이터 엔지니어 seojeon9의 블로그
url: https://seojeon9.github.io
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: dirt # air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise
locale: ko-KR
timezone: Asia/Seoul
search: true
permalink: /:categories/:title/
paginate: 10
paginate_path: /page:num/

author:
  name: seojeon9
  avatar: /assets/images/72624263.jpeg
  bio: 데이터는 새지 않게, 순간은 흩어지지 않게
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/seojeon9

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: single
      author_profile: true
      toc: true
      toc_sticky: true
      read_time: true
      show_date: true
